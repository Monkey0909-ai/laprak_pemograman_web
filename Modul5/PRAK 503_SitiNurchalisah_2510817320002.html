<!DOCTYPE html>
<html>
<body>
    <h1>Latihan JavaScript</h1>

    <p id="demo">
        Javascript bisa merubah isi elemen HTML
    </p>

    <script>
        function myFunction() {
            var x = document.getElementById("demo"); // temukan elemen yg mana
            x.style.color = "#f8dfca"; // rubah warnanya
        }
    </script>

    <button type="button" onclick="myFunction()">Click Me!</button>
</body>
</html>
